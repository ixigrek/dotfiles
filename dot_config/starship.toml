# Prompt starship — palette Gruvbox Material, alignée sur ghostty,
# zjstatus (~/.config/zellij/config.kdl) et ~/.zsh/40-theme.zsh.
# Icônes : preset officiel « Nerd Font Symbols » (starship preset
# nerd-font-symbols), recoloré sur la palette au lieu des couleurs par défaut.
#
# Aucun fond n'est peint (pas de style "bg:..." ni de segments powerline) :
# ghostty tourne en background-opacity 0.25 + macos-glass-regular, un fond
# opaque dans le prompt casserait le blur. Couleurs de texte uniquement.
#
# Le format est explicite : seuls les modules listés ci-dessous sont rendus.
# Les modules de langage n'affichent que leur icône, jamais $version : starship
# n'évalue une variable que si le format la référence, donc aucun `node -v`,
# `python --version` ni `go version` n'est lancé à chaque prompt. Le coût se
# limite à la détection de fichiers dans le répertoire courant.

format = """$username$hostname$directory$git_branch$git_status$git_state\
$fill\
$c$cpp$golang$rust$zig$swift$java$kotlin$scala$dotnet$elixir$haskell$ocaml\
$nodejs$deno$bun$python$ruby$php$lua$dart\
$conda$nix_shell$docker_context\
$cmd_duration$kubernetes$terraform${env_var.aws}$azure$gcloud
$character"""

add_newline = true
palette = "gruvbox_material"

[palettes.gruvbox_material]
fg     = "#d4be98"
grey0  = "#7c6f64"
grey1  = "#928374"
red    = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green  = "#a9b665"
aqua   = "#89b482"
blue   = "#7daea3"
purple = "#d3869b"

# --- Identité ---
# username et hostname ne s'affichent qu'en SSH ou en root : en local ils
# sont du bruit, à distance ils disent où tu es.
[username]
format = "[$user]($style)@"
style_user = "green bold"
style_root = "red bold"

[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "green bold"

[directory]
style = "blue bold"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "orange"

# --- Git ---
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple bold"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "orange"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "red bold"

# --- Langages et runtimes, poussés à droite par $fill ---
# Une icône, rien d'autre : le prompt dit « ce dépôt est du Go », il ne dit pas
# quelle version — `go version` est à un `go version` de distance, et le coûter
# à chaque prompt ne se justifie pas. Chaque module reste sur sa détection de
# fichiers par défaut (go.mod, package.json, Cargo.toml...).
[c]
symbol = " "
format = "[$symbol]($style)"
style = "blue bold"

# cpp est désactivé par défaut dans starship, contrairement à c.
[cpp]
disabled = false
symbol = " "
format = "[$symbol]($style)"
style = "blue bold"

[golang]
symbol = " "
format = "[$symbol]($style)"
style = "aqua bold"

[rust]
symbol = "󱘗 "
format = "[$symbol]($style)"
style = "orange bold"

[zig]
symbol = " "
format = "[$symbol]($style)"
style = "orange bold"

[swift]
symbol = " "
format = "[$symbol]($style)"
style = "orange bold"

[java]
symbol = " "
format = "[$symbol]($style)"
style = "red bold"

[kotlin]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

[scala]
symbol = " "
format = "[$symbol]($style)"
style = "red bold"

[dotnet]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

[elixir]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

[haskell]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

[ocaml]
symbol = " "
format = "[$symbol]($style)"
style = "orange bold"

[nodejs]
symbol = " "
format = "[$symbol]($style)"
style = "green bold"

[deno]
symbol = " "
format = "[$symbol]($style)"
style = "aqua bold"

[bun]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

# $virtualenv vient de $VIRTUAL_ENV : c'est une lecture d'environnement, pas un
# sous-processus. Le nom de l'env vaut la place qu'il prend.
[python]
symbol = " "
format = "[$symbol($virtualenv )]($style)"
style = "yellow bold"

[ruby]
symbol = " "
format = "[$symbol]($style)"
style = "red bold"

[php]
symbol = " "
format = "[$symbol]($style)"
style = "purple bold"

[lua]
symbol = " "
format = "[$symbol]($style)"
style = "blue bold"

[dart]
symbol = " "
format = "[$symbol]($style)"
style = "blue bold"

# --- Environnements ---
# Ces trois-là ne détectent rien sur le disque : conda et nix_shell lisent une
# variable d'environnement, docker_context le contexte docker courant.
[conda]
symbol = " "
format = "[$symbol$environment]($style) "
style = "green bold"

[nix_shell]
symbol = " "
format = "[$symbol$state( \\($name\\))]($style) "
style = "blue bold"

# Muet sur le contexte `default` : ne s'affiche que si tu as basculé ailleurs.
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue bold"

# --- Contexte d'exécution ---
# C'est la moitié qui compte : savoir sur quel cluster et quel compte on est
# AVANT de taper la commande.
[fill]
symbol = " "
style = "grey0"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "grey1"

# Même règle que les trois modules cloud ci-dessous, mais le filtre est ici
# natif : detect_env_vars limite le rendu aux shells où KUBECONFIG est posé,
# c'est-à-dire aux dépôts dont le .envrc appelle `use kube`
# (~/.config/direnv/direnvrc). Sans lui le module retomberait sur
# ~/.kube/config et afficherait son current-context partout, y compris dans ~,
# où il ne veut rien dire — et où il mentirait sur ce que kubectl ferait
# vraiment si le contexte du dépôt n'est pas celui du fichier global.
# Effet de bord utile : plus aucun kubeconfig lu hors projet, donc rien à
# optimiser côté latence de prompt.
[kubernetes]
disabled = false
detect_env_vars = ["KUBECONFIG"]
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "aqua bold"

# Un contexte de prod passe en rouge : le prompt doit crier avant le apply.
[[kubernetes.contexts]]
context_pattern = ".*(prod|prd).*"
style = "red bold"
symbol = "󱃾 "

[[kubernetes.contexts]]
context_pattern = ".*(staging|stg|preprod).*"
style = "yellow bold"
symbol = "󱃾 "

# $workspace seul, sans $version : afficher la version lancerait un
# `terraform version` à chaque prompt.
[terraform]
format = "[$symbol$workspace]($style) "
symbol = " "
style = "purple bold"

# --- Contexte cloud, cloisonné par répertoire ---
# Règle : hors d'un dépôt qui déclare son contexte (via direnv, cf.
# ~/.config/direnv/direnvrc), aucun provider ne s'affiche. Aucun de ces trois
# modules ne sait filtrer par chemin — `detect_folders` n'existe que sur
# kubernetes et terraform — donc le filtre passe par les variables d'env que
# direnv pose et retire à chaque cd.

# Le module aws natif n'est pas utilisable ici : il exige que starship
# reconnaisse des credentials (~/.aws/credentials, cache SSO, AWS_ACCESS_KEY_ID)
# et `aws login` range les siens dans ~/.aws/login/cache, qu'il ne lit pas —
# il resterait muet même dans le projet. Et `force_display = true` afficherait
# la région du profil [default] partout, y compris à $HOME.
# env_var règle les deux : rendu uniquement si AWS_PROFILE existe, donc
# uniquement là où direnv l'a posé, et sans le moindre sous-processus.
# Le symbole est celui du preset pour [aws], que ce module remplace.
[env_var.aws]
variable = "AWS_PROFILE"
format = "[$symbol$env_value]($style) "
symbol = " "
style = "yellow bold"

# azure ne connaît ni detect_folders ni detect_env_vars : il lit toujours
# $AZURE_CONFIG_DIR (à défaut ~/.azure) et affiche l'abonnement isDefault.
# Le cloisonnement se fait donc à la source, pas à l'affichage : 60-tools.zsh
# pointe la variable sur un répertoire vide, direnv la redirige vers le profil
# du projet (`use azure <profil>`). Pas de profil, pas d'abonnement, rien.
[azure]
disabled = false
format = "[$symbol$subscription]($style) "
symbol = " "
style = "blue bold"

# gcloud, lui, accepte detect_env_vars : il ne rend rien tant que la variable
# n'est pas posée. Sans ça il afficherait la configuration `default` partout.
# direnv l'exporte par dépôt (`use gcloud <configuration>`) ; le magasin de
# credentials reste commun, seule la configuration active change —
# contrairement à CLOUDSDK_CONFIG, qui isolerait aussi les tokens et
# imposerait un `gcloud auth login` par projet.
# Note : ce filtre ne porte que sur le prompt. La CLI, hors projet, continue
# d'utiliser la configuration `default` ; pour qu'elle soit neutre aussi :
# `gcloud config configurations activate default && gcloud config unset project`.
[gcloud]
format = "[$symbol$project]($style) "
symbol = "󱇶 "
style = "blue bold"
detect_env_vars = ["CLOUDSDK_ACTIVE_CONFIG_NAME"]

# --- Curseur ---
# vimcmd_symbol : zsh-vi-mode est actif, le prompt reflète le mode courant
# (en plus de l'indicateur NORMAL/INSERT de la barre zjstatus).
[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](yellow bold)"
# Pas de vimcmd_visual_symbol / vimcmd_replace_symbol : zsh ne remonte que
# viins et vicmd dans $KEYMAP, ces variantes ne se déclencheraient jamais.
